name: Prepare Yemen AI project

on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    
permissions:

  contents: write
  
jobs:

  unpack:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Unpack project
      
        run: |
        
          unzip -q yemen-ai-full-project.zip -d _package
          
          cp -a _package/full/yemen-ai/. .
          
          rm -rf _package yemen-ai-full-project.zip
          
      - name: Commit project files
      
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git commit -m "Prepare Yemen AI source tree" || exit 0
          
          git push
          





















